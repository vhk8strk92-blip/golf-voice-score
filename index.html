<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf Voice Score</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f8f5;
  padding: 15px;
}
h1 { color: #176b39; }
button, input {
  font-size: 19px;
  padding: 12px;
  margin: 6px;
}
button {
  background: #176b39;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
#namn { width: 85%; max-width: 450px; }
#spelare { color: #176b39; }
#status { font-size: 18px; }
#senaste {
  font-size: 21px;
  font-weight: bold;
  color: #176b39;
}
.tabellruta {
  width: 100%;
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  margin: 15px auto;
  font-size: 17px;
}
th, td {
  border: 1px solid #aaa;
  padding: 10px;
  min-width: 48px;
}
th { background: #d8eadc; }
.aktiv { background: #fff2b8; }
.total {
  background: #d8eadc;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>⛳ Golf Voice Score</h1>

<div id="start">
  <h2>Vilka spelar idag?</h2>
  <p>Skriv spelarnas namn med kommatecken emellan.</p>
  <input id="namn" placeholder="Anders, Peter, Colin">
  <br>
  <button onclick="starta()">Starta rundan</button>
</div>

<div id="spel" style="display:none">
  <h2 id="hal"></h2>
  <h2 id="spelare"></h2>

  <button onclick="startaMikrofon()">🎤 Starta mikrofon</button>

  <p id="status">Säg antal slag.</p>
  <p id="senaste"></p>

  <div class="tabellruta">
    <table id="scorekort"></table>
  </div>

  <button onclick="ratta()">Rätta senaste slag</button>
  <p id="framsteg"></p>
</div>

<div id="slut" style="display:none">
  <h2>Rundan är klar!</h2>
  <div class="tabellruta">
    <table id="slutkort"></table>
  </div>
</div>

<script>
let spelare = [];
let poang = [];
let hal = 0;
let tur = 0;
let historik = [];
let recognition = null;
let lyssnar = false;

function starta() {
  spelare = document.getElementById("namn").value
    .split(",")
    .map(n => n.trim())
    .filter(n => n);

  if (spelare.length === 0 || spelare.length > 8) {
    alert("Ange mellan 1 och 8 spelare.");
    return;
  }

  poang = spelare.map(() => Array(18).fill(null));
  hal = 0;
  tur = 0;
  historik = [];

  document.getElementById("start").style.display = "none";
  document.getElementById("spel").style.display = "block";

  visa();
}

function skydda(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function byggScorekort() {
  let html = "<tr><th>Hål</th>";

  spelare.forEach(namn => {
    html += "<th>" + skydda(namn) + "</th>";
  });

  html += "</tr>";

  for (let h = 0; h < 18; h++) {
    const klass = h === hal ? ' class="aktiv"' : "";
    html += "<tr" + klass + "><td>" + (h + 1) + "</td>";

    spelare.forEach((namn, i) => {
      const slag = poang[i][h];
      html += "<td>" +
        (slag === null ? "–" : slag) +
        "</td>";
    });

    html += "</tr>";
  }

  html += '<tr class="total"><td>Totalt</td>';

  spelare.forEach((namn, i) => {
    const total = poang[i].reduce(
      (summa, slag) => summa + (slag || 0), 0
    );

    html += "<td>" + total + "</td>";
  });

  html += "</tr>";

  return html;
}

function visa() {
  document.getElementById("hal").textContent =
    "Hål " + (hal + 1) + " av 18";

  document.getElementById("spelare").textContent =
    "Nuvarande spelare: " + spelare[tur];

  document.getElementById("scorekort").innerHTML =
    byggScorekort();

  document.getElementById("framsteg").textContent =
    "Registrerade slag: " + historik.length +
    " av " + (spelare.length * 18);
}

function startaMikrofon() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("status").textContent =
      "Röstigenkänning stöds inte i denna webbläsare.";
    return;
  }

  if (lyssnar) {
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "sv-SE";
  recognition.continuous = true;
  recognition.interimResults = false;

  const aktuell = recognition;
  const startHal = hal;
  let sistaResultat = -1;
  let stoppa = false;

  aktuell.onstart = function() {
    lyssnar = true;
    document.getElementById("status").textContent =
      "Lyssnar... Säg slag för " + spelare[tur];
  };

  aktuell.onresult = function(event) {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (!event.results[i].isFinal || i <= sistaResultat) {
        continue;
      }

      sistaResultat = i;

      const text = event.results[i][0].transcript
        .toLowerCase()
        .trim()
        .replace(/[.,!?]/g, "");

      const ord = {
        "ett": 1, "en": 1, "två": 2,
        "tre": 3, "fyra": 4, "fem": 5,
        "sex": 6, "sju": 7, "åtta": 8,
        "nio": 9, "tio": 10,
        "elva": 11, "tolv": 12,
        "tretton": 13, "fjorton": 14,
        "femton": 15
      };

      let slag = Number(text);

      if (!Number.isInteger(slag) || slag < 1) {
        slag = ord[text];
      }

      if (!Number.isInteger(slag) || slag < 1 || slag > 30) {
        document.getElementById("status").textContent =
          "Jag hörde: " + text + ". Försök igen.";
        continue;
      }

      registrera(slag);

      if (hal !== startHal) {
        stoppa = true;
        aktuell.stop();
        break;
      }

      document.getElementById("status").textContent =
        "Registrerat! Säg slag för " + spelare[tur];
    }
  };

  aktuell.onerror = function(event) {
    if (event.error !== "aborted") {
      document.getElementById("status").textContent =
        "Mikrofonfel: " + event.error;
    }
  };

  aktuell.onend = function() {
    lyssnar = false;

    if (!stoppa && hal === startHal) {
      document.getElementById("status").textContent =
        "Mikrofonen stannade. Tryck för att fortsätta.";
    }
  };

  try {
    aktuell.start();
  } catch (e) {
    lyssnar = false;
    document.getElementById("status").textContent =
      "Kunde inte starta mikrofonen.";
  }
}

function registrera(slag) {
  const namn = spelare[tur];

  poang[tur][hal] = slag;
  historik.push({ hal, tur, slag });

  document.getElementById("senaste").textContent =
    namn + ": " + slag + " slag";

  document.getElementById("status").textContent =
    "Registrerat! Tryck på mikrofonen för nästa spelare.";

  tur++;

  if (tur >= spelare.length) {
    tur = 0;
    hal++;
  }

  if (hal >= 18) {
    avsluta();
  } else {
    visa();
  }
}

function ratta() {
  if (historik.length === 0) return;

  const senaste = historik.pop();

  hal = senaste.hal;
  tur = senaste.tur;
  poang[tur][hal] = null;

  document.getElementById("senaste").textContent =
    "Rättar " + spelare[tur] +
    " på hål " + (hal + 1);

  document.getElementById("status").textContent =
    "Tryck på mikrofonen och ange rätt antal slag.";

  visa();
}

function avsluta() {
  document.getElementById("spel").style.display = "none";
  document.getElementById("slut").style.display = "block";
  document.getElementById("slutkort").innerHTML =
    byggScorekort();
}
</script>

</body>
</html>
